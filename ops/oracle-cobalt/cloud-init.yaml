#cloud-config
package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - docker-compose-v2
  - docker.io
  - fail2ban
  - jq
  - openssl
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/60-cobalt-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/sysctl.d/60-cobalt-network.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.tcp_syncookies=1
      net.ipv4.conf.all.rp_filter=1
      net.ipv4.conf.default.rp_filter=1

runcmd:
  - systemctl enable --now docker
  - systemctl enable --now fail2ban
  - systemctl restart ssh
  - sysctl --system
  - install -d -m 0750 -o ubuntu -g ubuntu /opt/cobalt
  - usermod -aG docker ubuntu
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable

final_message: "Cobalt host bootstrap finished after $UPTIME seconds."
